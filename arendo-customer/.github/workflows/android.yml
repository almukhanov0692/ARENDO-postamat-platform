name: Android gateway

on:
  pull_request:
    paths:
      - "device-android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "device-android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arendo-device-debug
          path: device-android/app/build/outputs/apk/debug/app-debug.apk

