name: Bug report
description: Report a reproducible ARENDO defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement or acceptance test
      placeholder: "A07 / T12"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version, Android version, postamat version, USB device and network state.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

